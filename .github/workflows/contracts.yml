name: Contracts

# On every PR into next-release and main:
#   Contracts             compile with proving keys, typecheck, simulator tests,
#                         then the browser UI: template drift check, typecheck,
#                         unit tests and a production build, then the
#                         same for the app
# On PRs into main, and when run by hand:
#   Contracts on Preview  the devnet tests, with real proofs and transactions,
#                         on the public Preview network (Ledger 9). The examples'
#                         local devnet isn't on Ledger 9 yet, so there's no local
#                         network to run them on. The suites run one after
#                         another: they share the same funded wallets.
#   Contracts on devnet   the one check name branch protection requires; it
#                         passes only if the Preview run did, and on PRs into
#                         next-release, where that run is skipped by design.
# The package runs inside a checkout of midnight-examples, pinned below, on its
# Ledger 9 stack (compiler 0.36.0, Midnight.js 5).

on:
  pull_request:
    branches: [next-release, main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EXAMPLES_REF: 377495c5efbd5b1f3123f5aee2776c3694b05eda
  PACKAGE: examples-repo/examples/private-bounties

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          path: bounties
          persist-credentials: false

      - name: Check out midnight-examples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          repository: midnightntwrk/midnight-examples
          ref: ${{ env.EXAMPLES_REF }}
          path: examples-repo
          persist-credentials: false

      - name: Add this package to the examples workspace
        run: |
          mkdir -p "$PACKAGE"
          rsync -a --exclude .git --exclude .github --exclude spike --exclude docs \
            --exclude ARCHITECTURE.md --exclude LICENSE bounties/ "$PACKAGE/"

      - name: Setup Compact compiler
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.36.0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  #v7.1.0
        with:
          node-version-file: examples-repo/.nvmrc

      # The examples repo pins npm 11 (its .npmrc's min-release-age needs 11.10+).
      - name: Use the pinned npm
        run: npm install -g npm@11.21.0

      # app/ is this project's own frontend, not a template UI, so the
      # examples repo's workspace globs don't cover it. Add one for it.
      - name: Add app/ as a workspace
        working-directory: examples-repo
        run: |
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.workspaces.push("examples/*/app");fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'

      # This package and app/ are new workspaces, so the lockfile changes and
      # `npm ci` would refuse. `npm install` resolves them against it.
      - name: Install dependencies
        working-directory: examples-repo
        run: npm install --no-audit --no-fund

      - name: Compile the contracts with proving keys
        working-directory: ${{ env.PACKAGE }}
        run: npm run compile

      - name: Typecheck
        working-directory: ${{ env.PACKAGE }}
        run: npm run typecheck

      - name: Run the simulator tests
        working-directory: ${{ env.PACKAGE }}
        run: npm run test:sim

      # ui/ was generated by midnight-examples' `npm run new:ui`, and its
      # template-owned files must stay identical to the template. `--check`
      # can't be used here: it also wants upstream's verification table to
      # list this UI, which it doesn't yet. So re-render the template-owned
      # files with `--sync` and fail on any difference from the committed ui/.
      - name: Check the UI still matches the template
        working-directory: examples-repo
        run: |
          npm run new:ui -- private-bounties --sync
          diff -r --exclude node_modules --exclude public --exclude dist ../bounties/ui examples/private-bounties/ui

      - name: Typecheck the UI
        working-directory: examples-repo
        run: npm run typecheck -w @midnight-ntwrk/example-private-bounties-ui

      - name: Run the UI unit tests
        working-directory: examples-repo
        run: npm run test:unit -w @midnight-ntwrk/example-private-bounties-ui

      - name: Build the UI
        working-directory: examples-repo
        run: npm run build -w @midnight-ntwrk/example-private-bounties-ui

      - name: Typecheck the app
        working-directory: examples-repo
        run: npm run typecheck -w @midnight-ntwrk/example-private-bounties-app

      - name: Run the app unit tests
        working-directory: examples-repo
        run: npm run test:unit -w @midnight-ntwrk/example-private-bounties-app

      - name: Build the app
        working-directory: examples-repo
        run: npm run build -w @midnight-ntwrk/example-private-bounties-app

  preview:
    name: Contracts on Preview
    # Only at the gate into main, or by hand: a run takes over an hour, on a
    # shared public network.
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    # One run at a time across the repo: every run spends from the same wallets.
    concurrency:
      group: contracts-preview
      cancel-in-progress: false
    steps:
      - name: Check out this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          path: bounties
          persist-credentials: false

      - name: Check out midnight-examples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          repository: midnightntwrk/midnight-examples
          ref: ${{ env.EXAMPLES_REF }}
          path: examples-repo
          persist-credentials: false

      - name: Add this package to the examples workspace
        run: |
          mkdir -p "$PACKAGE"
          rsync -a --exclude .git --exclude .github --exclude spike --exclude docs \
            --exclude ARCHITECTURE.md --exclude LICENSE --exclude app --exclude ui \
            bounties/ "$PACKAGE/"

      - name: Setup Compact compiler
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.36.0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  #v7.1.0
        with:
          node-version-file: examples-repo/.nvmrc

      - name: Use the pinned npm
        run: npm install -g npm@11.21.0

      - name: Install dependencies
        working-directory: examples-repo
        run: npm install --no-audit --no-fund

      - name: Compile the contracts with proving keys
        working-directory: ${{ env.PACKAGE }}
        run: npm run compile

      - name: Start the proof server
        working-directory: ${{ env.PACKAGE }}
        run: npm run proof:up

      # The suites read their wallets from MIDNIGHT_PREVIEW_<ROLE>_SEED: three
      # funded Preview test wallets, kept as repository secrets.
      - name: Run the devnet tests on Preview
        working-directory: ${{ env.PACKAGE }}
        env:
          MIDNIGHT_PREVIEW_ALICE_SEED: ${{ secrets.PREVIEW_ALICE_SEED }}
          MIDNIGHT_PREVIEW_BOB_SEED: ${{ secrets.PREVIEW_BOB_SEED }}
          MIDNIGHT_PREVIEW_CHARLIE_SEED: ${{ secrets.PREVIEW_CHARLIE_SEED }}
        run: |
          set -o pipefail
          for t in src/test/bounty_preimage.test.ts src/test/bounty_factor.test.ts \
                   src/test/bounty_signed_record.test.ts src/test/bounty_reviewed_work.test.ts; do
            npm run test:preview -- "$t" 2>&1 | tee -a preview-run.log
          done

      - name: Stop the proof server
        if: always()
        working-directory: ${{ env.PACKAGE }}
        run: npm run proof:down

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  #v7.0.2
        with:
          name: contracts-preview-logs
          path: ${{ env.PACKAGE }}/preview-run.log
          if-no-files-found: warn

  # One stable check name for branch protection, which requires "Contracts on
  # devnet". It passes when the Preview run passed, or when that run was
  # skipped because this is a PR into next-release. Into main it must pass.
  devnet-result:
    name: Contracts on devnet
    needs: [preview]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the Preview run
        env:
          RESULT: ${{ needs.preview.result }}
          INTO_MAIN: ${{ github.base_ref == 'main' }}
        run: |
          echo "preview=$RESULT into_main=$INTO_MAIN"
          if [ "$RESULT" = success ]; then exit 0; fi
          if [ "$RESULT" = skipped ] && [ "$INTO_MAIN" != true ]; then
            echo "Skipped by design: the Preview run is for PRs into main."
            exit 0
          fi
          exit 1
