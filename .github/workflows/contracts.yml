name: Contracts

# On every PR into next-release and main:
#   Contracts             compile with proving keys, typecheck, simulator tests
#   Contracts on devnet   the devnet tests, with real proofs and transactions
# The package runs inside a checkout of midnight-examples, pinned below, for
# its simulator package, wallets and devnet tooling.

on:
  pull_request:
    branches: [next-release, main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EXAMPLES_REF: 3498bd11144a6eb4ee8186fc096f5d785ae55a93
  PACKAGE: examples-repo/examples/private-bounties

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          path: bounties
          persist-credentials: false

      - name: Check out midnight-examples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          repository: midnightntwrk/midnight-examples
          ref: ${{ env.EXAMPLES_REF }}
          path: examples-repo
          persist-credentials: false

      - name: Add this package to the examples workspace
        run: |
          mkdir -p "$PACKAGE"
          rsync -a --exclude .git --exclude .github --exclude spike --exclude docs \
            --exclude ARCHITECTURE.md --exclude LICENSE bounties/ "$PACKAGE/"

      - name: Setup Compact compiler
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.31.1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  #v7.1.0
        with:
          node-version-file: examples-repo/.nvmrc

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      # This package is a new workspace, so the lockfile changes. Yarn makes
      # installs immutable in CI by default, so turn that off here.
      - name: Install dependencies
        working-directory: examples-repo
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: yarn install

      - name: Compile the contracts with proving keys
        working-directory: ${{ env.PACKAGE }}
        run: yarn compile

      - name: Typecheck
        working-directory: ${{ env.PACKAGE }}
        run: yarn typecheck

      - name: Run the simulator tests
        working-directory: ${{ env.PACKAGE }}
        run: yarn test:sim

  devnet:
    name: Contracts on devnet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          path: bounties
          persist-credentials: false

      - name: Check out midnight-examples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  #v7.0.1
        with:
          repository: midnightntwrk/midnight-examples
          ref: ${{ env.EXAMPLES_REF }}
          path: examples-repo
          persist-credentials: false

      - name: Add this package to the examples workspace
        run: |
          mkdir -p "$PACKAGE"
          rsync -a --exclude .git --exclude .github --exclude spike --exclude docs \
            --exclude ARCHITECTURE.md --exclude LICENSE bounties/ "$PACKAGE/"

      - name: Setup Compact compiler
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.31.1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  #v7.1.0
        with:
          node-version-file: examples-repo/.nvmrc

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      # This package is a new workspace, so the lockfile changes. Yarn makes
      # installs immutable in CI by default, so turn that off here.
      - name: Install dependencies
        working-directory: examples-repo
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: yarn install

      - name: Compile the contracts with proving keys
        working-directory: ${{ env.PACKAGE }}
        run: yarn compile

      - name: Start the local Midnight network
        working-directory: ${{ env.PACKAGE }}
        run: yarn env:up

      - name: Wait for DUST to accrue
        working-directory: ${{ env.PACKAGE }}
        run: yarn wait:dust

      - name: Run the devnet tests
        working-directory: ${{ env.PACKAGE }}
        run: |
          set -o pipefail
          yarn test:local 2>&1 | tee devnet-run.log

      - name: Collect service logs on failure
        if: failure()
        working-directory: ${{ env.PACKAGE }}
        run: mkdir -p logs && docker compose logs --no-color --timestamps > logs/compose.log 2>&1 || true

      - name: Stop the local Midnight network
        if: always()
        working-directory: ${{ env.PACKAGE }}
        run: yarn env:down

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  #v7.0.2
        with:
          name: contracts-devnet-logs
          path: |
            ${{ env.PACKAGE }}/devnet-run.log
            ${{ env.PACKAGE }}/logs/
          if-no-files-found: warn
